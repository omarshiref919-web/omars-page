<!DOCTYPE html>
<html>
    <head>
        <title>Omar's page</title>
    </head>
    <body>
        <div class="container">
    <h1>Welcome, Omar</h1>  
    <p>This is my home page</p> 
    <button onclick="aboutme(this)">About Me</button>
    <button  onclick="myprojects(this)">My Projects</button>
    <button onclick="myfavoritehobby(this)">My Favorite Hobby</button>
    <p id ="info"></p>
    </div>
    <img src="c:\Users\CompuMisr\OneDrive\Pictures\whatsapp\WhatsApp Image 2026-09-29 at 2.01.21 AM.jpeg" alt="my photo">
  <button class="logout" onclick="logout()">Logout</button>
  <button class="reset" onclick="resetInfo()">Reset🔁 </button>
  <button class="darkmode" onclick="DarkMode()">Dark Mode🌙</button>
    </body>
</html>
<style>
** {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #dbeafe, transparent 28%),
        #f8fafc;
    font-family: Arial, sans-serif;
    color: #102a43;
    padding: 20px;
    transition: 0.3s;
}

/* Main Container */

.container {
    width: 100%;
    max-width: 900px;
    margin: 20px auto;
    padding: 42px;
    text-align: center;

    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 24px;

    box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.12),
        0 2px 8px rgba(15, 23, 42, 0.05);

    transition: 0.3s;
}

/* Title */

h1 {
    margin: 0 0 15px;
    color: #0f172a;
    font-size: 38px;
    letter-spacing: -1px;
}

/* Paragraph */

p {
    margin: 0 auto;
    max-width: 700px;
    font-size: 18px;
    line-height: 1.7;
    color: #64748b;
}

/* Image */

img {
    width: 260px;
    height: 300px;
    object-fit: cover;

    display: block;
    margin: 30px auto;

    border-radius: 20px;

    box-shadow:
        0 10px 30px rgba(16, 42, 67, 0.15);

    transition:
        transform 0.3s,
        box-shadow 0.3s;
}

img:hover {
    transform: translateY(-4px);
    box-shadow:
        0 15px 35px rgba(16, 42, 67, 0.20);
}

/* Buttons */

button {
    background: #102a43;
    color: white;

    border: none;
    padding: 12px 24px;
    margin: 6px;

    border-radius: 12px;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        0 5px 12px rgba(16, 42, 67, 0.15);
}

button:hover {
    background: #243b53;
    transform: translateY(-2px);

    box-shadow:
        0 8px 18px rgba(16, 42, 67, 0.20);
}

button:active {
    transform: translateY(0);
}

/* Active Button */

.active {
    background: #ffffff;
    color: #102a43;

    border: 2px solid #102a43;

    box-shadow:
        0 0 0 4px rgba(16, 42, 67, 0.08);

    transform: translateY(-2px);
}

.active:hover {
    background: #f1f5f9;
    color: #102a43;
    border-color: #102a43;

    transform: translateY(-2px);

    box-shadow:
        0 6px 18px rgba(16, 42, 67, 0.15);
}

/* Dark Mode Button */

.darkmode {
    display: block;

    margin: 20px auto 0;

    padding: 10px 18px;

    background: white;
    color: #102a43;

    border: 1px solid #dbe1e8;
    border-radius: 50px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        0 4px 12px rgba(16, 42, 67, 0.12);
}

.darkmode:hover {
    background: #102a43;
    color: white;

    box-shadow:
        0 7px 16px rgba(16, 42, 67, 0.18);
}

/* Logout */

.logout {
    display: block;

    margin: 25px auto;

    background: #102a43;
}

/* Reset */

.reset {
    display: block;

    margin: 20px auto 0;

    padding: 10px 18px;

    background: #ffffff;
    color: #102a43;

    border: 1px solid #cbd5e1;
    border-radius: 50px;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.25s;

    box-shadow:
        0 4px 12px rgba(16, 42, 67, 0.12);
}

.reset:hover {
    background: #102a43;
    color: white;

    transform: translateY(-2px);
}

/* =========================
   Dark Mode
   ========================= */

.dark-mode {
    background:
        radial-gradient(
            circle at top left,
            #64748b,
            transparent 32%
        ),
        radial-gradient(
            circle at bottom right,
            #1e3a8a,
            transparent 38%
        ),
        #0f172a;

    color: white;
}

.dark-mode .container {
    background: rgba(30, 41, 59, 0.88);

    border-color: rgba(255, 255, 255, 0.08);

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.30);
}

.dark-mode h1 {
    color: #f8fafc;
}

.dark-mode p {
    color: #cbd5e1;
}

/* Dark Buttons */

.dark-mode button {
    background: #334155;
    color: #f8fafc;
}

.dark-mode button:hover {
    background: #475569;
}

/* Dark Mode Button */

.dark-mode .darkmode {
    background: #334155;
    color: #f8fafc;

    border-color: #475569;
}

.dark-mode .darkmode:hover {
    background: #475569;
}

/* Dark Reset */

.dark-mode .reset {
    background: #334155;
    color: #f8fafc;

    border-color: #475569;
}

.dark-mode .reset:hover {
    background: #475569;
}

/* Dark Active Button */

.dark-mode .active {
    background: #f8fafc;
    color: #0f172a;

    border: 2px solid #cbd5e1;

    box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.25);
}

.dark-mode .active:hover {
    background: #e2e8f0;
    color: #0f172a;

    border-color: #f8fafc;

    transform: translateY(-2px);
}

/* Dark Image */

.dark-mode img {
    box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.45);
}

/* =========================
   Tablet
   ========================= */

@media (max-width: 800px) {

    body {
        padding: 16px;
    }

    .container {
        padding: 35px 28px;
    }

    h1 {
        font-size: 34px;
    }

    p {
        font-size: 17px;
    }
}

/* =========================
   Phone
   ========================= */

@media (max-width: 600px) {

    body {
        padding: 12px;
        overflow-x: hidden;
    }

    .container {
        width: 100%;
        margin: 10px auto;
        padding: 30px 18px;

        border-radius: 22px;
    }

    h1 {
        font-size: clamp(26px, 8vw, 32px);
        margin-bottom: 12px;
    }

    p {
        font-size: 15px;
        line-height: 1.6;
    }

    img {
        width: min(220px, 75vw);
        height: 260px;

        margin: 25px auto;
        border-radius: 18px;
    }

    button {
        padding: 11px 18px;
        font-size: 14px;
    }

    .darkmode,
    .reset {
        margin-top: 16px;
    }

    .logout {
        margin: 20px auto;
    }
}

/* =========================
   Small Phones
   ========================= */

@media (max-width: 380px) {

    body {
        padding: 8px;
    }

    .container {
        padding: 25px 15px;
        border-radius: 20px;
    }

    h1 {
        font-size: 26px;
    }

    p {
        font-size: 14px;
    }

    img {
        width: 190px;
        height: 230px;
    }

    button {
        width: 100%;
        margin: 5px 0;
    }

    .darkmode,
    .reset {
        width: auto;
        padding: 10px 18px;
    }
}

/* =========================
   Landscape Phones
   ========================= */

@media (max-height: 500px) and (orientation: landscape) {

    body {
        align-items: flex-start;
    }

    .container {
        margin: 15px auto;
        padding: 25px;
    }

    img {
        width: 180px;
        height: 200px;
        margin: 20px auto;
    }
}
</style>
<script>
   function setActive(button) {
    let buttons = document.querySelectorAll("button");

    buttons.forEach(function(btn) {
        btn.classList.remove("active");
    });

    button.classList.add("active");
}

function aboutme(button) {
    setActive(button);

    document.getElementById("info").innerHTML =
        "My name is Omar.<br>" +
        "I'm 16 years old.<br>" +
        "I'm interested in football and programming.<br>" +
        "My favorite player is Cristiano Ronaldo 🐐.";
}

function myprojects(button) {
    setActive(button);

    document.getElementById("info").innerHTML =
        "My projects:<br>" +
        "1. Login Page 🔐<br>" +
        "2. Personal Home Page 💻<br>" +
        "3. More Projects Coming Soon 🔥";
}

function myfavoritehobby(button) {
    setActive(button);

    document.getElementById("info").innerHTML =
        "My favorite hobbies are:<br>" +
        "Programming 💻<br>" +
        "Football ⚽";
}
    function logout(){
        window.location.href="index.html"
    }
    function DarkMode(){
         document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkMode", "true");
    } else {
        localStorage.setItem("darkMode", "false");
    }
}

if (localStorage.getItem("darkMode")=== "true") {
    document.body.classList.add("dark-mode");
}else {
    document.body.classList.remove("dark-mode");
    } 
    function resetInfo() {
    let buttons = document.querySelectorAll("button");

    buttons.forEach(function(btn) {
        btn.classList.remove("active");
        document.getElementById("info").innerHTML = "";
    });
}
</script>
