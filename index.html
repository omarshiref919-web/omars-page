<title>Omar's page</title>
<div class="login-box">
<h1>Login</h1>
<h1>Omar's page</h1>
<input id ="username" type="text" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button class="login-btn" onclick="login()">Login</button>
<button class="show-password" onclick="showPassword()">👁️</button>
<button class="reset-btn" onclick="reset()">Reset</button>
<p id ="message"></p>
</div>
<button class="dark-btn" onclick="DarkMode()">Dark Mode🌙</button>

 <style>
   * {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #dbeafe, transparent 28%), #f8fafc;
}

/* Login Card */
.login-box {
    width: 380px;
    padding: 42px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 24px;
    box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.12),
        0 2px 8px rgba(15, 23, 42, 0.05);
    text-align: center;
}

/* Title */
h1 {
    margin: 0 0 30px;
    color: #0f172a;
    font-size: 34px;
    letter-spacing: -1px;
}

/* Inputs */
input {
    width: 100%;
    padding: 14px 16px;
    margin: 8px 0;
    border: 1px solid #dbe1e8;
    border-radius: 12px;
    outline: none;
    background: rgba(255, 255, 255, 0.9);
    color: #0f172a;
    font-size: 15px;
    transition: 0.25s;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

/* Login Button */
.login-btn {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: white;
    font-size: 16px;
    font-weight: bold;
     cursor: pointer; 
    transition: 0.25s;
    box-shadow: 0 8px 18px rgba(30, 58, 138, 0.2);
}

.login-btn:hover {
    transform: translateY(-2px);
     box-shadow: 0 12px 24px rgba(30, 58, 138, 0.28); 
}

.login-btn:active {
    transform: translateY(0);
    
}

/* Show Password */
.show-password {
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 18px;
    opacity: 0.65;
    transition: 0.2s;
}

.show-password:hover {
     opacity: 1;
    transform: scale(1.1);
}

/* Reset */
.reset-btn {
    margin-top: 16px;
    padding: 7px 12px;
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

.reset-btn:hover {
    color: #1e3a8a;
}

/* Message */
#message {
    margin-top: 18px;
    font-size: 14px;
    font-weight: bold;
    animation: messageIn 0.3s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}
   .dark-mode {
    background:
        radial-gradient(circle at top left, #64748b, transparent 32%),
        radial-gradient(circle at bottom right, #1e3a8a, transparent 38%),
        #0f172a;
color: white;
   }

 
 .dark-btn {
    position: fixed;
    top: calc(50% + 270px);
    left: 50%;
    transform: translateX(-50%);

    padding: 10px 18px;
    border: 1px solid #dbe1e8;
    border-radius: 50px;
    background: white;
    color: #102a43;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
    box-shadow: 0 4px 12px rgba(16, 42, 67, 0.12);
}

.dark-btn:hover {
     background: #102a43;
     color: white; 
    box-shadow: 0 7px 16px rgba(16, 42, 67, 0.18);
}
 .dark-mode .dark-btn {
    background: #334155;
    color: #f8fafc;
    border-color: #475569;
}

.dark-mode .dark-btn:hover {
    background: #475569;
}

 </style>

<script>
    let attemps=0;
function login (){
    let message=document.getElementById("message");
    if(attemps>=5){
         message.textContent="Too many attempts. Try again in 30 seconds.";
    }
    attemps+=1;
    let username=
    document .getElementById("username").value;
    let password=
    document .getElementById("password").value;

      if(username===""|| password===""){
        message.textContent="Please fill in all filds. Attemps"+attemps;
        message.style.color="red";
        message.style.animation=
        "none";
         message.offsetHeight;
        message.style.animation="message 0.5s";
         if(attemps===5) {startLockout(message);}
      }
    else if (username==="omar"&& password=== "omar2010"){
    document .getElementById("message").textContent="login succesful";
   document.getElementById("message") .style.color="green";
    message.style.animation= 
    "none";
     message.offsetHeight;
    message.style.animation= 
    "message 0.5s";
    window.location.href="home.html";
    } else{
    document.getElementById("message").textContent="Incorrect password or username. Attemps"+attemps;
    document.getElementById("message").style.color="red"
    message.style.animation= 
    "none";
     message.offsetHeight;
    message.style.animation= 
    "message 0.5s";
if(attemps===5) {startLockout(message);}
    }
}function startLockout() {
    let time = 30;

    message.textContent = "Too many attempts. Try again in " + time + " seconds.";

    let timer = setInterval(function() {
        time--;

        message.textContent = "Too many attempts. Try again in " + time + " seconds.";

        if (time === 0) {
            clearInterval(timer);
            attemps = 0;
            message.textContent = "";
        }
    }, 1000);
}
    
     
    function showPassword(){
        let password= 
        document.getElementById("password");
        if (password.type==="password"){
            password.type="text";
        }else{
            password.type="password";
        }
        
    
}
function reset(){
    document.getElementById("username").value="";
    document.getElementById("password").value="";
}
function DarkMode() {
    document.body.classList.toggle("dark-mode");

    if (document.body.classList.contains("dark-mode")) {
        localStorage.setItem("darkMode", "true");
    } else {
        localStorage.setItem("darkMode", "false");
    }
}

if (localStorage.getItem("darkMode")=== "true") {
    document.body.classList.add("dark-mode");
}else {
    document.body.classList.remove("dark-mode");
}

</script>
